name: Deploy to pages

on:
  push:
    branches: "main"
  schedule:
    - cron: "0 */2 * 1-6,9-12 *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-slim
    outputs:
      changed: ${{ steps.generator.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Restore cache
        uses: actions/cache/restore@v5
        with:
          key: plan-xlsx-cache
          restore-keys: |
            plan-xlsx-cache-
          path: plan.xlsx

      - name: Run generator script
        id: generator
        run: python main.py
        env:
          FORCE_DEPLOY: ${{ github.event_name != 'schedule' }}

      - name: Save cache
        if: ${{ steps.generator.outputs.changed == 'true' }}
        uses: actions/cache/save@v5
        with:
          key: plan-xlsx-cache-${{ hashFiles('plan.xlsx') }}
          path: plan.xlsx

      - uses: actions/upload-pages-artifact@v5
        if: ${{ steps.generator.outputs.changed == 'true' }}
        with:
          path: "build"
  webhook:
    needs: build
    if: ${{ needs.build.outputs.changed == 'true' }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore previous build
        uses: actions/cache/restore@v5
        with:
          key: webhook-cache-latest
          restore-keys: |
            webhook-cache-
          path: build-old

      - uses: actions/download-artifact@v5
        name: Download built page
        with:
          name: github-pages

      - name: Extract latest build
        run: |
          tar xf artifact.tar -C build

      - name: Discord webhook notification
        run: python webhook.py
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # The cache version depends on the path, so it has to be saved under the
      # same path it is restored to, otherwise the restore never finds it
      - name: Prepare latest page for cache
        run: rm -rf build-old && cp -r build build-old

      - name: Save latest page
        uses: actions/cache/save@v5
        with:
          key: webhook-cache-${{ hashFiles('build/**') }}
          path: build-old
  deploy:
    needs: build
    if: ${{ needs.build.outputs.changed == 'true' }}
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to pages
        id: deployment
        uses: actions/deploy-pages@v5
